<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/style.css">
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Geist:wght@400..700&display=swap" rel="stylesheet" />
 <title>CraftFlow | Artisan Studio Tracker</title>
  <script src="./index.js" defer></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased selection:bg-rose-100">

   <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/85 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-3">
      <div class="flex items-center gap-3">
        <span class="grid size-9 place-items-center rounded-[10px] bg-rose-600 text-white shadow-sm shadow-rose-600/40" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 9-5 9-10S17.523 2 12 2 3 7 3 12s3.477 10 9 10z"/><path d="M12 6v12"/><path d="M6 12h12"/></svg>
        </span>
        <div>
          <h1 id="heading" class="font-display text-lg font-bold leading-none tracking-tight">CraftFlow</h1>
          <p class="mt-1 text-xs text-slate-500">Artisan Studio Workspace Manager</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="helpBtn" aria-label="Studio usage guidelines" class="inline-flex h-10 items-center justify-center gap-2 whitespace-nowrap rounded-[10px] border border-slate-200 bg-white px-4 text-sm font-semibold text-slate-900 shadow-xs transition hover:border-slate-300 hover:bg-slate-50 active:translate-y-px">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          <span class="hidden sm:inline">How it works</span>
        </button>
        <button id="headerAddBtn" class="inline-flex h-10 items-center justify-center gap-2 whitespace-nowrap rounded-[10px] bg-rose-600 px-4 text-sm font-semibold text-white shadow-sm shadow-rose-700/50 transition hover:bg-rose-700 active:translate-y-px">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New Craft Step
          <kbd class="hidden h-5 min-w-5 place-items-center rounded-md border border-white/30 bg-white/10 px-1 font-sans text-[11px] font-semibold leading-none text-rose-100 sm:inline-grid">N</kbd>
        </button>
      </div>
    </div>
  </header>
</body>
</html>
